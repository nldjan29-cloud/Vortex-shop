<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex Shop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:black;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    font-size:35px;
}

header p{
    margin-top:10px;
    color:gold;
}

.produits{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.carte{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    transition:0.3s;
}

.carte:hover{
    transform:scale(1.03);
}

.carte img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.info{
    padding:15px;
    text-align:center;
}

.info h2{
    margin-bottom:10px;
}

.prix{
    color:green;
    font-size:20px;
    margin-bottom:15px;
}

button{
    background:black;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:gold;
    color:black;
}

.panier{
    position:fixed;
    top:20px;
    right:20px;
    background:red;
    color:white;
    padding:10px 15px;
    border-radius:50px;
    font-weight:bold;
}

footer{
    background:black;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}

.whatsapp{
    display:inline-block;
    margin-top:10px;
    background:green;
    color:white;
    padding:10px 20px;
    border-radius:10px;
    text-decoration:none;
}
</style>
</head>
<body>

<div class="panier">
🛒 <span id="compteur">0</span>
</div>

<header>
<h1>VORTEX SHOP</h1>
<p>Parfums • Sacs • Vêtements</p>
</header>

<section class="produits">

<div class="carte">
<img src="https://images.unsplash.com/photo-1541643600914-78b084683601?q=80&w=800" alt="">
<div class="info">
<h2>Parfum Luxe</h2>
<p class="prix">15 000 FCFA</p>
<button onclick="ajouter()">Ajouter au panier</button>
</div>
</div>

<div class="carte">
<img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?q=80&w=800" alt="">
<div class="info">
<h2>Sac Élégant</h2>
<p class="prix">12 000 FCFA</p>
<button onclick="ajouter()">Ajouter au panier</button>
</div>
</div>

<div class="carte">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=800" alt="">
<div class="info">
<h2>T-Shirt Fashion</h2>
<p class="prix">5 000 FCFA</p>
<button onclick="ajouter()">Ajouter au panier</button>
</div>
</div>

</section>

<footer>
<h3>Commander maintenant</h3>

<a class="whatsapp"
href="https://wa.me/2250700000000">
Contacter sur WhatsApp
</a>

<p style="margin-top:15px;">
© 2026 Vortex Shop
</p>
</footer>

<script>
let compteur = 0;

function ajouter(){
    compteur++;
    document.getElementById("compteur").innerText = compteur;
}
</script>

</body>
</html>
